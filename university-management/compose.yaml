services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: university
      POSTGRES_USER: ums
      POSTGRES_PASSWORD: ums_pass
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ums -d university"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/university
      SPRING_DATASOURCE_USERNAME: ums
      SPRING_DATASOURCE_PASSWORD: ums_pass
      APP_JWT_SECRET: compose-demo-secret-key-please-change-me-0123456789
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
