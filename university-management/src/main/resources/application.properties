spring.application.name=university-management

# Default: in-memory H2 database (run locally with no setup).
# docker compose overrides these with PostgreSQL via environment variables.
spring.datasource.url=jdbc:h2:mem:university
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

# Show the reason in JSON error responses (e.g. "username already exists")
server.error.include-message=always

# JWT: secret must be at least 32 characters. Override with APP_JWT_SECRET in real use.
app.jwt.secret=change-me-please-this-is-a-demo-secret-key-123456
app.jwt.expiration-ms=3600000
